<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10K Build — Training Log</title>
<style>
  :root{
    --bg: #12140F;
    --panel: #1A1D15;
    --panel-2: #20241A;
    --line: #34392A;
    --moss: #8FA05C;
    --moss-dim: #5C6B3E;
    --tan: #C9A66B;
    --text: #E8E6DA;
    --text-dim: #9AA087;
    --blue: #6E93B0;
    --red: #B0605A;
    --font-display: 'Bahnschrift', 'Segoe UI Semibold', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --font-body: -apple-system, 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    padding: 0;
    min-height: 100vh;
  }
  .wrap{max-width: 720px; margin: 0 auto; padding: 24px 18px 60px;}

  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom: 2px solid var(--moss);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }
  header h1{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.3px;
    line-height: 1.1;
  }
  header .sub{
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-top: 4px;
  }
  header .badge{
    font-family: var(--font-mono);
    font-size: 0.7rem;
    background: var(--panel-2);
    border: 1px solid var(--moss-dim);
    color: var(--moss);
    padding: 4px 8px;
    border-radius: 3px;
    white-space: nowrap;
  }

  nav.tabs{
    display:flex;
    gap: 2px;
    margin-bottom: 20px;
    background: var(--panel);
    border-radius: 6px;
    padding: 3px;
  }
  nav.tabs button{
    flex:1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 9px 0;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  nav.tabs button.active{
    background: var(--moss-dim);
    color: var(--text);
  }

  section{display:none;}
  section.active{display:block;}

  /* PLAN TAB */
  .week-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .week-head{
    display:flex; justify-content:space-between; align-items:center;
    padding: 13px 15px;
    cursor: pointer;
  }
  .week-head .wk-label{
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 700;
  }
  .week-head .wk-meta{
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--tan);
    text-align:right;
  }
  .week-head .wk-phase{
    font-size: 0.7rem;
    color: var(--text-dim);
    display:block;
  }
  .week-body{
    display:none;
    padding: 0 15px 14px;
    border-top: 1px solid var(--line);
  }
  .week-body.open{display:block;}
  .day-row{
    display:flex; justify-content:space-between; align-items:center;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.87rem;
  }
  .day-row:last-child{border-bottom:none;}
  .day-name{
    font-weight: 600;
    width: 38px;
    flex-shrink:0;
  }
  .day-type{
    flex:1;
    color: var(--text-dim);
    font-size: 0.82rem;
    padding-left: 4px;
  }
  .day-type .tag{
    display:inline-block;
    font-size: 0.65rem;
    font-family: var(--font-mono);
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: 1px;
  }
  .tag-vig{background: rgba(176,96,90,0.18); color: var(--red); border:1px solid rgba(176,96,90,0.4);}
  .tag-z2{background: rgba(110,147,176,0.18); color: var(--blue); border:1px solid rgba(110,147,176,0.4);}
  .tag-long{background: rgba(201,166,107,0.18); color: var(--tan); border:1px solid rgba(201,166,107,0.4);}
  .tag-off{background: rgba(154,160,135,0.12); color: var(--text-dim); border:1px solid var(--line);}
  .day-dist{
    font-family: var(--font-mono);
    font-weight: 600;
    width: 52px;
    text-align:right;
    flex-shrink:0;
  }

  /* LOG TAB */
  .log-form{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .log-form h2{
    font-family: var(--font-display);
    font-size: 0.95rem;
    margin-bottom: 12px;
    color: var(--tan);
  }
  .field-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .field{display:flex; flex-direction:column; gap:4px;}
  .field.full{grid-column: 1 / -1;}
  .field label{
    font-size: 0.72rem;
    color: var(--text-dim);
    text-transform: lowercase;
  }
  .field input, .field select, .field textarea{
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 5px;
    padding: 8px 9px;
    font-size: 0.87rem;
    font-family: var(--font-body);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline: none;
    border-color: var(--moss);
  }
  .submit-btn{
    width:100%;
    background: var(--moss-dim);
    color: var(--text);
    border: none;
    padding: 11px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 4px;
  }
  .submit-btn:active{background: var(--moss);}

  .week-progress{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .week-progress .wp-top{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 8px;
  }
  .week-progress .wp-top .wp-num{
    font-family: var(--font-mono);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--moss);
  }
  .week-progress .wp-top .wp-target{
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .bar-track{
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill{
    height:100%;
    background: linear-gradient(90deg, var(--moss-dim), var(--moss));
    transition: width 0.3s;
  }

  .entry{
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--moss-dim);
    border-radius: 6px;
    padding: 11px 14px;
    margin-bottom: 8px;
  }
  .entry-top{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom: 3px;
  }
  .entry-top .e-day{font-weight:700; font-size:0.88rem;}
  .entry-top .e-date{font-family: var(--font-mono); font-size:0.72rem; color: var(--text-dim);}
  .entry-stats{
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--tan);
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .entry-note{
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 5px;
    font-style: italic;
  }
  .entry-del{
    background:none; border:none; color: var(--text-dim);
    font-size: 0.7rem; cursor:pointer; text-decoration: underline;
    margin-top: 6px;
  }
  .empty-state{
    text-align:center;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 30px 10px;
  }
  .loading{color: var(--text-dim); font-size:0.85rem; padding: 20px 0; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>10K Build</h1>
      <div class="sub">Tue/Thu vigorous · Sat long run · Wed &amp; Sun buffer</div>
    </div>
    <div class="badge">SUB-60 TARGET</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="plan">Plan</button>
    <button class="tab-btn" data-tab="log">Log</button>
  </nav>

  <section id="plan" class="active"></section>

  <section id="log">
    <div class="week-progress">
      <div class="wp-top">
        <span class="wp-num" id="wp-current">0.0 mi</span>
        <span class="wp-target" id="wp-target">/ 0 mi this week</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="wp-bar" style="width:0%"></div></div>
    </div>

    <div class="log-form">
      <h2>Log a run</h2>
      <div class="field-row">
        <div class="field">
          <label>Week</label>
          <select id="f-week"></select>
        </div>
        <div class="field">
          <label>Day</label>
          <select id="f-day">
            <option>Mon</option><option selected>Tue</option><option>Wed</option>
            <option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Distance (mi)</label>
          <input type="number" step="0.01" id="f-dist" placeholder="2.4">
        </div>
        <div class="field">
          <label>Avg HR (bpm)</label>
          <input type="number" id="f-hr" placeholder="138">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Avg pace (min/mi)</label>
          <input type="text" id="f-pace" placeholder="12:15">
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="f-date">
        </div>
      </div>
      <div class="field full">
        <label>Notes (optional)</label>
        <textarea id="f-note" rows="2" placeholder="knee felt tight last half mile..."></textarea>
      </div>
      <button class="submit-btn" id="submit-entry">Log run</button>
    </div>

    <div id="entries-list">
      <div class="loading">Loading log…</div>
    </div>
  </section>
</div>

<script>
const PLAN = [
  {phase:"Base", days:{Mon:1.5, Tue:2.0, Wed:1.0, Thu:2.0, Fri:1.5, Sat:4.0, Sun:0}},
  {phase:"Base", days:{Mon:1.5, Tue:2.0, Wed:1.0, Thu:2.0, Fri:1.5, Sat:4.0, Sun:0}},
  {phase:"Build", days:{Mon:1.5, Tue:2.5, Wed:1.0, Thu:2.5, Fri:1.5, Sat:5.0, Sun:0}},
  {phase:"Build", days:{Mon:1.5, Tue:2.5, Wed:1.0, Thu:2.5, Fri:1.5, Sat:5.0, Sun:0}},
  {phase:"Build", days:{Mon:1.5, Tue:3.0, Wed:1.0, Thu:3.0, Fri:1.5, Sat:6.0, Sun:0}},
  {phase:"Build", days:{Mon:1.5, Tue:3.0, Wed:1.0, Thu:3.0, Fri:1.5, Sat:6.0, Sun:0}},
  {phase:"Peak", days:{Mon:2.0, Tue:3.0, Wed:1.0, Thu:3.0, Fri:2.0, Sat:7.0, Sun:0}},
  {phase:"Peak", days:{Mon:2.0, Tue:3.0, Wed:1.0, Thu:3.0, Fri:2.0, Sat:7.0, Sun:0}},
  {phase:"Peak", days:{Mon:2.0, Tue:3.5, Wed:1.0, Thu:3.5, Fri:2.0, Sat:8.0, Sun:0}},
  {phase:"Peak", days:{Mon:2.0, Tue:3.5, Wed:1.0, Thu:3.5, Fri:2.0, Sat:8.0, Sun:0}},
  {phase:"Taper", days:{Mon:1.5, Tue:2.5, Wed:1.0, Thu:2.5, Fri:1.5, Sat:5.0, Sun:0}},
  {phase:"Race", days:{Mon:1.5, Tue:1.5, Wed:0, Thu:1.0, Fri:0, Sat:6.2, Sun:0}},
];

const DAY_TYPE = {
  Mon:{tag:"Z2", cls:"tag-z2", label:"Zone 2 — under 141bpm"},
  Tue:{tag:"VIG", cls:"tag-vig", label:"Intervals — 162 ceiling / 142 floor"},
  Wed:{tag:"Z2", cls:"tag-z2", label:"Light Z2 — flexes down if needed"},
  Thu:{tag:"VIG", cls:"tag-vig", label:"Tempo — 162 ceiling / 142 floor"},
  Fri:{tag:"Z2", cls:"tag-z2", label:"Zone 2 — under 141bpm"},
  Sat:{tag:"LONG", cls:"tag-long", label:"Long run — friend's pace"},
  Sun:{tag:"OFF", cls:"tag-off", label:"Off or easy Z2, your call"}
};
const RACE_WEEK_OVERRIDES = {
  Mon:"Zone 2 — under 141bpm",
  Tue:"Shakeout strides — light",
  Wed:"Off",
  Thu:"Shakeout — 1mi easy",
  Fri:"Off — rest before race",
  Sat:"RACE DAY — 10K",
  Sun:"Off / recovery walk"
};

function renderPlan(){
  const container = document.getElementById('plan');
  container.innerHTML = '';
  PLAN.forEach((wk, i) => {
    const weekNum = i+1;
    const total = Object.values(wk.days).reduce((a,b)=>a+b,0);
    const card = document.createElement('div');
    card.className = 'week-card';

    const head = document.createElement('div');
    head.className = 'week-head';
    head.innerHTML = `
      <div>
        <span class="wk-label">Week ${weekNum}</span>
        <span class="wk-phase">${wk.phase}</span>
      </div>
      <div class="wk-meta">${total.toFixed(1)} mi<span class="wk-phase" style="text-align:right;">${weekNum===12? 'race week' : 'long run '+wk.days.Sat+'mi'}</span></div>
    `;
    const body = document.createElement('div');
    body.className = 'week-body';

    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>{
      const dist = wk.days[d];
      const info = DAY_TYPE[d];
      const label = weekNum === 12 ? RACE_WEEK_OVERRIDES[d] : info.label;
      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <span class="day-name">${d}</span>
        <span class="day-type"><span class="tag ${dist===0?'tag-off':info.cls}">${dist===0?'OFF':info.tag}</span>${label}</span>
        <span class="day-dist">${dist===0?'—':dist.toFixed(1)+'mi'}</span>
      `;
      body.appendChild(row);
    });

    head.addEventListener('click', ()=>{
      body.classList.toggle('open');
    });

    card.appendChild(head);
    card.appendChild(body);
    container.appendChild(card);
  });
  // open week 1 by default
  const firstBody = container.querySelector('.week-body');
  if(firstBody) firstBody.classList.add('open');
}

function populateWeekSelect(){
  const sel = document.getElementById('f-week');
  for(let i=1;i<=12;i++){
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `Week ${i}`;
    sel.appendChild(opt);
  }
}

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'log') refreshLog();
  });
});

// Storage
async function loadEntries(){
  try{
    const res = await window.storage.get('entries', false);
    return res ? JSON.parse(res.value) : [];
  }catch(e){
    return [];
  }
}
async function saveEntries(entries){
  try{
    await window.storage.set('entries', JSON.stringify(entries), false);
  }catch(e){
    console.error('save failed', e);
  }
}

function currentWeekTarget(weekNum){
  const wk = PLAN[weekNum-1];
  return Object.values(wk.days).reduce((a,b)=>a+b,0);
}

async function refreshLog(){
  const listEl = document.getElementById('entries-list');
  listEl.innerHTML = '<div class="loading">Loading log…</div>';
  const entries = await loadEntries();
  entries.sort((a,b)=> new Date(b.date) - new Date(a.date));

  // progress: use most recent entry's week, or week 1 if none
  const activeWeek = entries.length ? Math.max(...entries.map(e=>parseInt(e.week))) : 1;
  const weekEntries = entries.filter(e=>parseInt(e.week) === activeWeek);
  const sum = weekEntries.reduce((a,e)=>a+parseFloat(e.dist||0),0);
  const target = currentWeekTarget(activeWeek);
  document.getElementById('wp-current').textContent = sum.toFixed(1)+' mi';
  document.getElementById('wp-target').textContent = `/ ${target.toFixed(1)} mi — Week ${activeWeek}`;
  document.getElementById('wp-bar').style.width = Math.min(100,(sum/target)*100)+'%';

  if(entries.length === 0){
    listEl.innerHTML = '<div class="empty-state">No runs logged yet. Add one above.</div>';
    return;
  }
  listEl.innerHTML = '';
  entries.forEach(e=>{
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div class="entry-top">
        <span class="e-day">Wk${e.week} · ${e.day}</span>
        <span class="e-date">${e.date || ''}</span>
      </div>
      <div class="entry-stats">
        <span>${parseFloat(e.dist).toFixed(2)} mi</span>
        ${e.hr ? `<span>${e.hr} bpm</span>` : ''}
        ${e.pace ? `<span>${e.pace}/mi</span>` : ''}
      </div>
      ${e.note ? `<div class="entry-note">${escapeHtml(e.note)}</div>` : ''}
      <button class="entry-del" data-id="${e.id}">remove</button>
    `;
    listEl.appendChild(div);
  });

  listEl.querySelectorAll('.entry-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const all = await loadEntries();
      const filtered = all.filter(e=>e.id !== id);
      await saveEntries(filtered);
      refreshLog();
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

document.getElementById('submit-entry').addEventListener('click', async ()=>{
  const week = document.getElementById('f-week').value;
  const day = document.getElementById('f-day').value;
  const dist = document.getElementById('f-dist').value;
  const hr = document.getElementById('f-hr').value;
  const pace = document.getElementById('f-pace').value;
  const date = document.getElementById('f-date').value;
  const note = document.getElementById('f-note').value;

  if(!dist || parseFloat(dist) <= 0){
    alert('Enter a distance to log this run.');
    return;
  }

  const entries = await loadEntries();
  entries.push({
    id: Date.now().toString(),
    week, day, dist, hr, pace,
    date: date || new Date().toISOString().split('T')[0],
    note
  });
  await saveEntries(entries);

  document.getElementById('f-dist').value = '';
  document.getElementById('f-hr').value = '';
  document.getElementById('f-pace').value = '';
  document.getElementById('f-note').value = '';

  refreshLog();
});

// init
renderPlan();
populateWeekSelect();
document.getElementById('f-date').valueAsDate = new Date();
refreshLog();
</script>
</body>
</html>
